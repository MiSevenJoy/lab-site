# Decap CMS 配置
# 网站管理后台：https://misevenjoy.github.io/lab-site/admin/

backend:
  name: github
  repo: MiSevenJoy/lab-site
  branch: main
  # OAuth 代理地址（免费部署在 Render）
  base_url: https://lab-site-oauth.onrender.com
  auth_endpoint: auth

# 上传图片保存位置
media_folder: "images/uploads"
public_folder: "images/uploads"

site_url: https://misevenjoy.github.io/lab-site/
display_url: https://misevenjoy.github.io/lab-site/

# 后台界面语言
locale: zh_Hans

# 自定义图片媒体库：上传自动压缩、支持裁剪（由 admin/media-library.js 提供）
media_library:
  name: imagelib

# 通用编辑器设置：Jekyll 页面无法实时预览，关闭预览
editor:
  preview: false

# 文件名编码：使用 unicode，保留中文等非 ASCII 字符（避免上传图片名被清空）
slug:
  encoding: unicode

collections:
  # =====================================================
  # 新闻动态（主页「最新进展」）
  # =====================================================
  - name: posts
    label: 新闻动态
    label_singular: 新闻
    description: 编写实验室新闻（标题、照片、详情、发布时间），主页「最新进展」自动按发布时间倒序展示，点击卡片进入详情页。
    media_folder: "/images/news"
    public_folder: "images/news"
    folder: _posts/
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - {label: 标题（主页卡片显示）, name: title, widget: string}
      - {label: 照片（主页卡片左侧显示）, name: image, widget: image, required: false}
      - {label: 发布时间（自动按此从新到旧排列）, name: date, widget: datetime, format: YYYY-MM-DD}
      - label: 详情附件
        name: attachment
        widget: file
        required: false
        hint: 可上传 Word 文档或 Markdown（.md）文档。Markdown 文档会在详情页直接渲染显示；Word 等其他文档显示为「下载附件」按钮。
      - label: 详情正文（Markdown，可插入图片）
        name: body
        widget: markdown
        hint: "中英文段落需分别标注语言：中文段落后紧跟一行 {: .lang-zh}，英文段落后紧跟一行 {: .lang-en}。注意：标记必须紧跟段落、两者之间不要空行，否则会出现中英文同时显示。"

  # =====================================================
  # 团队成员
  # =====================================================
  - name: members
    label: 团队成员
    label_singular: 成员
    description: 编辑团队成员的姓名、照片、职称与简介。
    media_folder: "/images/team"
    public_folder: "images/team"
    folder: _members/
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{name.zh}} / {{name.en}}"
    fields:
      - {label: 英文姓名（用于网址文件名）, name: title, widget: string}
      - label: 姓名
        name: name
        widget: object
        fields:
          - {label: 中文名, name: zh, widget: string}
          - {label: English, name: en, widget: string}
      - {label: 照片, name: image, widget: image, required: false}
      - {label: 邮箱, name: email, widget: string, required: false}
      - {label: 入学 / 加入时间（用于成员排序）, name: date, widget: datetime, format: YYYY-MM-DD, required: false}
      - label: 类别
        name: role
        widget: select
        options:
          - {label: 教授 / 负责人, value: professor}
          - {label: 博士后, value: postdoc}
          - {label: 教师, value: teacher}
          - {label: 博士生, value: phd}
          - {label: 硕士生, value: master}
          - {label: 本科生, value: undergrad}
          - {label: 毕业生, value: graduate}
      - label: 职称 / 年级
        name: description
        widget: object
        required: false
        fields:
          - {label: 中文, name: zh, widget: string}
          - {label: English, name: en, widget: string}
      - label: 姓名别名（用于论文检索）
        name: aliases
        widget: list
        required: false
        summary: "{{fields.alias}}"
        field: {label: 别名, name: alias, widget: string}
      - {label: 个人主页链接（填写后显示，留空则不显示）, name: homepage, widget: string, required: false}
      - label: 其他链接（社交等，可选）
        name: links
        widget: map
        key_type: string
        value_type: string
        required: false
      - {label: 个人简介, name: body, widget: markdown}

  # =====================================================
  # 研究项目
  # =====================================================
  - name: projects
    label: 研究项目
    label_singular: 项目
    description: 编辑首页与「研究项目」页展示的科研项目列表。
    files:
      - name: projects
        label: 研究项目列表
        file: _data/projects.yaml
        fields:
          - label: 项目
            name: items
            widget: list
            fields:
              - label: 标题
                name: title
                widget: object
                fields:
                  - {label: 中文, name: zh, widget: string}
                  - {label: English, name: en, widget: string}
              - label: 信息（时间 / 金额 / 角色）
                name: subtitle
                widget: object
                required: false
                fields:
                  - {label: 中文, name: zh, widget: string}
                  - {label: English, name: en, widget: string}
              - label: 分组（featured = 首页重点展示）
                name: group
                widget: select
                required: false
                options:
                  - {label: 普通, value: ""}
                  - {label: 重点展示, value: featured}
              - {label: 配图, name: image, widget: image, required: false}

  # =====================================================
  # 研究成果（论文）
  # =====================================================
  - name: citations
    label: 研究成果
    label_singular: 论文
    description: 编辑「研究成果」页展示的论文列表。type 填 journal（期刊 J）或 conference（会议 C）。
    files:
      - name: citations
        label: 论文列表
        file: _data/citations.yaml
        fields:
          - label: 论文
            name: items
            widget: paperlist
            hint: 输入标题或 DOI 可自动获取作者、日期、期刊/会议等信息；未命中或需微调时可手动修改。
            fields:
              - {label: ID（DOI 或备注）, name: id, widget: string, required: false}
              - {label: 标题, name: title, widget: string}
              - label: 作者
                name: authors
                widget: list
                field: {label: 作者, name: author, widget: string}
              - {label: 发表期刊 / 会议, name: publisher, widget: string, required: false}
              - {label: 发表日期（YYYY-MM-DD）, name: date, widget: datetime, format: YYYY-MM-DD}
              - {label: 链接（DOI 或网址）, name: link, widget: string, required: false}
              - {label: GitHub 代码链接, name: code, widget: string, required: false}
              - {label: PDF 链接, name: pdf, widget: string, required: false}
              - label: 类型
                name: type
                widget: select
                default: conference
                options:
                  - {label: 会议 C, value: conference}
                  - {label: 期刊 J, value: journal}

  # =====================================================
  # 网站外观（主页顶部 / 页脚背景图）
  # =====================================================
  - name: appearance
    label: 网站外观
    label_singular: 外观
    description: 修改实验室主页顶部与页脚的背景图片，可上传自己的图片。
    media_folder: "/images/uploads"
    public_folder: "images/uploads"
    files:
      - name: appearance
        label: 网站外观
        file: _data/site.yaml
        fields:
          - {label: 页面顶部背景图（主页大图）, name: header, widget: image, required: false}
          - {label: 页脚背景图, name: footer, widget: image, required: false}

  # =====================================================
  # 相册
  # =====================================================
  - name: gallery
    label: 相册
    label_singular: 照片
    description: 管理「相册」页展示的照片与描述，可上传新照片。
    media_folder: "/images/gallery"
    public_folder: "images/gallery"
    files:
      - name: gallery
        label: 相册照片
        file: _data/gallery.yaml
        fields:
          - label: 照片
            name: photos
            widget: list
            summary: "{{fields.image}}"
            fields:
              - {label: 图片, name: image, widget: image, required: false}
              - label: 描述
                name: caption
                widget: object
                required: false
                fields:
                  - {label: 中文, name: zh, widget: string}
                  - {label: English, name: en, widget: string}

  # =====================================================
  # 招生招聘（加入我们）
  # =====================================================
  - name: join
    label: 招生招聘
    label_singular: 栏目
    description: 编辑「加入我们」页面的招聘与招生信息，分为博士后/科研助理、博士生、硕士生、本科生四个栏目。
    files:
      - name: join
        label: 招生招聘信息
        file: _data/join.yaml
        fields:
          - label: 栏目
            name: sections
            widget: list
            summary: "{{fields.title.zh}}"
            fields:
              - label: 标题
                name: title
                widget: object
                fields:
                  - {label: 中文, name: zh, widget: string}
                  - {label: English, name: en, widget: string}
              - label: 内容（支持 Markdown 语法）
                name: content
                widget: object
                fields:
                  - {label: 中文内容, name: zh, widget: markdown}
                  - {label: English content, name: en, widget: markdown}
